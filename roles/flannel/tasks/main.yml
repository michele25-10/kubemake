---
# Deploy Flannel using standard Kubernetes manifests
- name: download flannel manifest
  get_url:
    url: https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
    dest: /tmp/kube-flannel.yml
    mode: '0644'

- name: configure flannel interface regex
  replace:
    path: /tmp/kube-flannel.yml
    regexp: '(- --kube-subnet-mgr)'
    replace: '\1\n        - --iface-regex={{ flannel_iface_regex }}'
  when: flannel_iface_regex is defined

- name: apply flannel manifest
  become: no
  kubernetes.core.k8s:
    state: present
    src: /tmp/kube-flannel.yml

- name: wait for flannel pods to be ready
  become: no
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: kube-flannel
    label_selectors:
      - app=flannel
  register: flannel_pods
  until: flannel_pods.resources | length > 0 and flannel_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
  retries: 30
  delay: 10
