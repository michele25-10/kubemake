---
# https://github.com/cri-o/packaging/blob/main/README.md#install-the-dependencies-for-adding-repositories
- name: add crio configuration file to /etc/modules-load.d/
  copy:
    src: modules-load.conf
    dest: /etc/modules-load.d/crio.conf
    owner: root
    group: root

- name: ensure br_netfilter module is loaded
  shell: modprobe br_netfilter

# this is not required anymore for the latest versions of cri-o
- name: ensure iptables works properly
  copy:
    src: iptables.conf
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    owner: root
    group: root

- name: reload system kernel parameters
  shell: sysctl --system

- name: remove old cri-o repository
  file:
    path: /etc/apt/sources.list.d/cri-o.list
    state: absent

- name: remove old cri-o keyring
  file:
    path: /etc/apt/keyrings/cri-o-apt-keyring.gpg
    state: absent

- name: ensure /etc/apt/keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# CORRETTO: URL aggiornato senza "addons:" nel percorso
- name: add cri-o repository key
  ansible.builtin.shell: |
    curl -fsSL https://pkgs.k8s.io/addons:/cri-o:/prerelease:/main/deb/Release.key | 
    gpg --dearmor -o /etc/apt/keyrings/cri-o-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/cri-o-apt-keyring.gpg

# CORRETTO: Usa il repository prerelease/main che è mantenuto attivamente
- name: add cri-o repository to sources list
  copy:
    dest: /etc/apt/sources.list.d/cri-o.list
    content: |
      deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://pkgs.k8s.io/addons:/cri-o:/prerelease:/main/deb/ /
    owner: root
    group: root
    mode: '0644'

- name: clean apt cache
  apt:
    update_cache: yes
    force_apt_get: yes

- name: uninstall conmon
  apt:
    name: conmon
    state: absent
  ignore_errors: yes

- name: install cri-o
  apt:
    name: "{{ packages }}"
    state: present
    update_cache: yes
  vars:
    packages:
    - cri-o

- name: reload system unit files
  systemd_service:
    daemon_reload: true

- name: enable and start cri-o service
  systemd_service:
    name: crio
    enabled: true
    state: started
